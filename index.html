<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASHEN CROWN: Knight's Last Stand</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#050308;overflow:hidden;font-family:"Courier New",monospace;color:#e8dcc0;touch-action:none}
#root{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:0 0;background:#000;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;animation:fin .35s ease}
.screen.on{display:flex}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dim{background:radial-gradient(ellipse at center,rgba(8,4,14,.78),rgba(4,2,8,.94))}
.dimlt{background:rgba(6,3,10,.62)}
h1.logo{font-size:44px;letter-spacing:6px;color:#ffd870;text-shadow:0 0 18px #ff9a20,0 4px 0 #6a3a08,0 0 40px #ff6a00;text-align:center;line-height:1}
h1.logo small{display:block;font-size:15px;letter-spacing:5px;color:#d8c8a0;text-shadow:0 0 8px #000;margin-top:8px}
h2{font-size:26px;letter-spacing:4px;color:#ffd870;text-shadow:0 0 12px #ff9a20;margin-bottom:8px;text-align:center}
.btn{pointer-events:auto;cursor:pointer;background:linear-gradient(#2c2234,#150f1b);border:2px solid #7a6030;color:#f0e0b0;padding:6px 16px;font:bold 14px "Courier New",monospace;letter-spacing:2px;margin:3px;transition:all .12s;text-transform:uppercase;min-width:80px;text-align:center}
.btn:hover,.btn.sel{border-color:#ffd870;color:#fff;box-shadow:0 0 14px #ffb83099;transform:scale(1.05)}
.btn.dis{opacity:.4;cursor:not-allowed}
.btn.chosen{border-color:#ffe890;color:#fff;background:linear-gradient(#5a4020,#2a1a0c);box-shadow:0 0 10px #ffd87088}
.btn.big{font-size:17px;min-width:240px;padding:8px 18px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}
.cards{display:flex;gap:12px;justify-content:center;align-items:stretch}
.card{width:222px;background:linear-gradient(#241a2c,#120c18);border:2px solid #4a3a28;padding:8px;font-size:10.5px;line-height:1.3;cursor:pointer;transition:all .18s;position:relative}
.card:hover,.card.sel{border-color:#ffd870;box-shadow:0 0 22px #ffb83088,inset 0 0 20px #ffb83022;transform:translateY(-4px)}
.card.chosen{border-color:#ffe890;box-shadow:0 0 30px #ffd870cc}
.card h3{font-size:14px;color:#ffd870;letter-spacing:1px}
.card .ttl{color:#b8a888;font-style:italic;margin-bottom:3px}
.card canvas{display:block;margin:0 auto;image-rendering:pixelated;width:128px;height:96px;background:radial-gradient(#3a2a4a,#150e1c)}
.bar{display:flex;align-items:center;gap:4px;margin:1px 0}.bar span{width:34px;color:#a89878}
.bar i{flex:1;height:6px;background:#0a0710;border:1px solid #3a2a20;position:relative}.bar i b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c88a20,#ffe070)}
.pill{display:inline-block;padding:0 5px;border:1px solid #6a5a3a;margin:1px;font-size:10px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.dot{width:16px;height:16px;border:2px solid #6a5a3a;cursor:pointer;position:relative}.dot.on{border-color:#fff;box-shadow:0 0 8px #fff}.dot.lock::after{content:"🔒";font-size:9px;position:absolute;left:0;top:-1px}
.rar-Common{border-color:#9a9a9a}.rar-Rare{border-color:#4a8aff}.rar-Epic{border-color:#b05aff}.rar-Legendary{border-color:#ffb020}
.card.up{width:210px;min-height:210px;text-align:center;font-size:12px;padding:14px 10px}
.card.up .ic{font-size:36px;margin:6px 0}
.card.up .rar{font-size:11px;letter-spacing:2px;text-transform:uppercase}
.rar-Common .rar{color:#bbb}.rar-Rare .rar{color:#6aa8ff}.rar-Epic .rar{color:#c880ff}.rar-Legendary .rar{color:#ffc040;text-shadow:0 0 8px #ff9000}
.panel{background:rgba(14,9,20,.9);border:2px solid #6a5030;padding:12px 18px;max-width:880px;max-height:470px;overflow:auto;font-size:13px;line-height:1.45}
.grid{display:grid;gap:8px}
.node{border:2px solid #4a3a28;padding:8px;background:#150f1b;cursor:pointer;font-size:12px;width:204px}
.node:hover,.node.sel{border-color:#ffd870;box-shadow:0 0 12px #ffb83077}
.node b{color:#ffd870}
.ach{display:flex;gap:8px;padding:4px 6px;border-bottom:1px solid #2a2030;opacity:.45}.ach.got{opacity:1;color:#ffe090}
.sld{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:14px}.sld label{width:200px}.sld input[type=range]{width:200px;pointer-events:auto}
.key{pointer-events:auto;cursor:pointer;display:inline-block;border:1px solid #7a6030;padding:1px 8px;margin:2px;background:#1c1424;font-size:12px}
.key:hover{border-color:#ffd870}
.stat{display:flex;justify-content:space-between;gap:30px;border-bottom:1px dotted #4a3a28;padding:2px 0}
.grade{font-size:80px;font-weight:bold;color:#ffd870;text-shadow:0 0 20px #ff8800;line-height:1}
#toasts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:9}
.toast{background:#1c1226ee;border:2px solid #ffd870;padding:6px 12px;font-size:12px;animation:tin .4s ease,tout .5s ease 3.5s forwards;box-shadow:0 0 16px #ffb83099}
.toast b{color:#ffd870}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}@keyframes tout{to{opacity:0;transform:translateX(60%)}}
#story{max-width:620px;text-align:center;font-size:13px;line-height:1.5;color:#d8c8a0;min-height:84px;margin:10px 0 6px;text-shadow:0 0 6px #000}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:20}
body.touch #touch.on{display:block}
.tb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,230,160,.18);border:2px solid rgba(255,230,160,.5);color:#fff;font:bold 13px "Courier New",monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(255,230,160,.45)}
#fsbtn{position:absolute;left:6px;top:6px;z-index:8;pointer-events:auto;font-size:11px;padding:2px 8px;min-width:0;opacity:.6}
</style>
</head>

  sign:v=>v<0?-1:1,
  num:(v,d=0)=>Number.isFinite(v)?v:d,
  hash:n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)},
  overlap:(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,
  ease:t=>t*t*(3-2*t),

  _rc:{},

};

  consume(a){this.press[a]=-9}
  axis(){let x=(this.down.right?1:0)-(this.down.left?1:0);if(!x&&this.padAx)x=this.padAx;return x}
  keyName(code){return String(code||'?').replace('Key','').replace('Arrow','').replace('Digit','').replace('Left','L ').replace('Right','R ')}
}

/* =====================================================================
   Camera: smooth follow, lookahead, shake, zoom pulse, cinematic focus
   ===================================================================== */
class Camera {
  constructor(){this.x=0;this.y=0;this.zoom=1;this.tr=0;this.sx=0;this.sy=0;this.kick=0;this.focus=null;this.look=0;this.worldW=CONFIG.world.stageW}
  shake(a){this.tr=Math.min(1,this.tr+a)}
  pulse(a){this.kick=Math.max(this.kick,a)}
  snap(x){this.x=U.clamp(x-W/2,0,Math.max(0,this.worldW-W));this.look=0}
  update(dt,g){
    const p=g.player;let tx=this.x,tz=1;
    if(this.focus){tx=this.focus.x-W/2;tz=this.focus.zoom||1.4}
    else if(p){this.look=U.lerp(this.look,p.face*(Math.abs(p.vx)>10?44:18),1-Math.exp(-dt*3));tx=p.x+this.look-W/2}
    tx=U.clamp(tx,0,Math.max(0,this.worldW-W));
    this.x=U.lerp(this.x,tx,1-Math.exp(-dt*(this.focus?3:7)));
    this.zoom=U.lerp(this.zoom,tz+this.kick,1-Math.exp(-dt*6));this.kick*=Math.exp(-dt*4);
    this.tr=Math.max(0,this.tr-dt*1.7);const m=this.tr*this.tr*10*(Save.data?Save.data.settings.shake:1);
    this.sx=(Math.random()*2-1)*m;this.sy=(Math.random()*2-1)*m;
  }
  apply(ctx){const z=this.zoom;ctx.translate(W/2,H*0.62);ctx.scale(z,z);ctx.translate(-W/2-Math.round(this.x+this.sx),-H*0.62+Math.round(this.sy))}
}

/* =====================================================================
   ParticleSystem: pooled particles, slash trails, floating texts
   ===================================================================== */
class ParticleSystem {
  constructor(n=900){this.p=[];for(let i=0;i<n;i++)this.p.push({a:false});this.i=0;this.tr=[];for(let i=0;i<40;i++)this.tr.push({a:false});this.tx=[];for(let i=0;i<70;i++)this.tx.push({a:false});this.ti=0;this.tri=0}
  add(x,y,vx,vy,life,size,col,grav=0,drag=0,f=0){
    let q=null;const n=this.p.length;for(let k=0;k<n;k++){const c=this.p[(this.i+k)%n];if(!c.a){q=c;this.i=(this.i+k+1)%n;break}}
    if(!q){q=this.p[this.i];this.i=(this.i+1)%n}
    q.a=true;q.x=x;q.y=y;q.vx=vx;q.vy=vy;q.life=life;q.max=life;q.size=size;q.col=col;q.grav=grav;q.drag=drag;q.f=f;q.r=0;return q}
  burst(x,y,n,col,spd=100,life=.5,grav=300,size=2,f=0){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*spd;this.add(x,y,Math.cos(a)*s,Math.sin(a)*s-spd*.2,life*(.6+Math.random()*.6),size,col,grav,1,f|4)}}
  sparks(x,y,n,col='#ffe090',spd=150){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.6);this.add(x,y,Math.cos(a)*s,Math.sin(a)*s,.18+Math.random()*.2,1.5,col,200,2,1|8)}}
  ichor(x,y,n,dir=1,col='#2a1030'){for(let i=0;i<n;i++)this.add(x,y,dir*(30+Math.random()*100)+(Math.random()-.5)*60,-60-Math.random()*100,.5+Math.random()*.4,1+Math.random()*1.5,col,500,0,16)}
  dust(x,y,n=4,col='#b8a898'){for(let i=0;i<n;i++)this.add(x+(Math.random()-.5)*8,y-1,(Math.random()-.5)*40,-10-Math.random()*20,.35+Math.random()*.25,2+Math.random()*2,col,-10,2,4)}
  ring(x,y,col='#fff',grow=140,life=.35){const q=this.add(x,y,0,0,life,grow,col,0,0,2|1);return q}
  ember(x,y,col='#ff8a30'){this.add(x,y,(Math.random()-.5)*20,-20-Math.random()*30,1+Math.random(),1,col,-5,0.2,1|4)}
  trail(x,y,r,a0,a1,col,w=5,life=.18){const t=this.tr[this.tri=(this.tri+1)%this.tr.length];t.a=true;t.k=0;t.x=x;t.y=y;t.r=r;t.a0=a0;t.a1=a1;t.col=col;t.w=w;t.life=life;t.max=life}
  line(x1,y1,x2,y2,col='#9cf',life=.2){const t=this.tr[this.tri=(this.tri+1)%this.tr.length];t.a=true;t.k=1;t.x=x1;t.y=y1;t.x2=x2;t.y2=y2;t.col=col;t.w=2;t.life=life;t.max=life}
  text(x,y,s,col='#fff',size=8,life=.8){if(!Save.data.settings.dmgNums&&size<9&&col!=='#f44'&&col!=='#fa4'&&col!=='#fd5')return;const t=this.tx[this.ti=(this.ti+1)%this.tx.length];t.a=true;t.x=x+(Math.random()-.5)*6;t.y=y;t.vy=-34;t.s=String(s);t.col=col;t.size=size;t.life=life;t.max=life}
  update(dt){
    for(const q of this.p){if(!q.a)continue;q.life-=dt;if(q.life<=0){q.a=false;continue}
      if(q.f&2){q.r+=q.size*dt;continue}
      q.vy+=q.grav*dt;if(q.drag){const d=Math.max(0,1-q.drag*dt);q.vx*=d;if(!(q.f&16)&&!(q.grav))q.vy*=d}
      q.x+=q.vx*dt;q.y+=q.vy*dt;if((q.f&16)&&q.y>GROUND){q.y=GROUND;q.vy=0;q.vx*=.5;q.grav=0}}
    for(const t of this.tr)if(t.a){t.life-=dt;if(t.life<=0)t.a=false}
    for(const t of this.tx)if(t.a){t.life-=dt;t.y+=t.vy*dt;t.vy*=.96;if(t.life<=0)t.a=false}
  }
  draw(ctx,add){
    if(add){ctx.globalCompositeOperation='lighter';
      for(const q of this.p){if(!q.a||!(q.f&1))continue;const a=q.life/q.max;ctx.globalAlpha=a;
        if(q.f&2){ctx.strokeStyle=q.col;ctx.lineWidth=2*a+.5;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.stroke()}
        else if(q.f&8){ctx.strokeStyle=q.col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);ctx.stroke()}
        else{ctx.fillStyle=q.col;const s=(q.f&4)?q.size*a:q.size;ctx.fillRect(q.x-s/2,q.y-s/2,s,s)}}
      for(const t of this.tr){if(!t.a)continue;const a=t.life/t.max;ctx.globalAlpha=a;ctx.strokeStyle=t.col;ctx.lineWidth=t.w*a+1;ctx.beginPath();if(t.k)ctx.moveTo(t.x,t.y),ctx.lineTo(t.x2,t.y2);else ctx.arc(t.x,t.y,t.r,t.a0,t.a1,t.a1<t.a0);ctx.stroke()}
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';return}
    for(const q of this.p){if(!q.a||(q.f&1))continue;const a=q.life/q.max;ctx.globalAlpha=Math.min(1,a*1.5);ctx.fillStyle=q.col;const s=(q.f&4)?Math.max(.6,q.size*a):q.size;ctx.fillRect(Math.round(q.x-s/2),Math.round(q.y-s/2),s,s)}
    ctx.globalAlpha=1;
  }
  drawTexts(ctx){ctx.textAlign='center';for(const t of this.tx){if(!t.a)continue;ctx.globalAlpha=Math.min(1,t.life/t.max*2);ctx.font='bold '+t.size+'px "Courier New",monospace';ctx.lineWidth=2.5;ctx.strokeStyle='#000';ctx.strokeText(t.s,Math.round(t.x),Math.round(t.y));ctx.fillStyle=t.col;ctx.fillText(t.s,Math.round(t.x),Math.round(t.y))}ctx.globalAlpha=1}
}

/* =====================================================================
   ProjectileSystem: pooled projectiles (enemy 'e' and player 'p')
   ===================================================================== */
class ProjectileSystem {
  constructor(g,n=220){this.g=g;this.l=[];for(let i=0;i<n;i++)this.l.push({a:false,hit:new Set()})}
  spawn(o){let p=null;for(const c of this.l)if(!c.a){p=c;break}if(!p)return null;
    Object.assign(p,{a:true,own:'e',kind:'orb',x:0,y:0,vx:0,vy:0,w:8,h:8,dmg:8,life:5,grav:0,home:0,hp:0,pierce:false,block:true,parry:true,col:'#c6f',freeze:false,t:0,name:'Projectile',land:null,ang:0,crit:false,src:null,boss:false});
    p.hit.clear();Object.assign(p,o);return p}
  end(p,boom){p.a=false;if(p.kind==='bomb'&&boom)this.g.explode(p.x,p.y,48,p.dmg,p.dmg*3,{name:'Cinder Imp blast'})}
  destroyIn(r){let n=0;for(const p of this.l){if(!p.a||p.own!=='e'||p.hp<=0)continue;if(U.overlap(r,{x:p.x-p.w/2-2,y:p.y-p.h/2-2,w:p.w+4,h:p.h+4})){p.a=false;n++;this.g.parts.sparks(p.x,p.y,8,p.col);audio.sfx('clang',.5)}}return n}
  update(dt){const g=this.g,pl=g.player;
    for(const p of this.l){if(!p.a)continue;p.t+=dt;p.life-=dt;
      if(p.life<=0){this.end(p,true);continue}
      if(p.home>0&&p.own==='e'&&!pl.dead){const sp=Math.hypot(p.vx,p.vy)||1,ta=Math.atan2(pl.y-pl.h/2-p.y,pl.x-p.x);let ca=Math.atan2(p.vy,p.vx),da=ta-ca;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;ca+=U.clamp(da,-p.home*dt,p.home*dt);p.vx=Math.cos(ca)*sp;p.vy=Math.sin(ca)*sp}
      p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.ang=Math.atan2(p.vy,p.vx);
      if(Math.random()<dt*20&&p.kind!=='holy')g.parts.add(p.x,p.y,0,0,.25,2,p.col,0,0,1|4);
      if(p.grav>0&&p.y>=GROUND-1){if(p.land)p.land(p,g);p.a=false;continue}
      if(p.x<-80||p.x>g.level.worldW+80||p.y>H+40||p.y<-80){p.a=false;continue}
      const r={x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h};
      if(p.own==='e'){
        if(!pl.dead&&U.overlap(r,pl.rect)){const res=pl.takeHit(p.src||{x:p.x-Math.sign(p.vx)*10,y:p.y},p.dmg,{proj:true,unblock:!p.block,parry:p.parry,name:p.name,p});
          if(res==='hit'){if(p.freeze)pl.frozen=1.1;if(!p.pierce)p.a=false}
          else if(res==='blocked'){if(!p.pierce)p.a=false}
          else if(res==='parried'){if(pl.m.reflect&&p.hp>=0){p.own='p';p.vx*=-1.3;p.vy*=-1.3;p.dmg=Math.max(10,p.dmg*2);p.hit.clear();p.life=3;p.grav=0;p.pierce=false;p.home=0}else p.a=false}}
      } else {
        for(const e of g.enemies){if(e.dead||p.hit.has(e.id)||!U.overlap(r,e.rect))continue;p.hit.add(e.id);
          const res=g.hitEnemy(e,p.dmg,{dir:Math.sign(p.vx)||1,kx:p.kind==='holy'?120:60,st:.3,fromPlayer:true,proj:true,crit:false});
          if(res&&res.blocked&&!p.pierce){p.a=false;break}if(!p.pierce&&res){p.a=false;break}}
        if(p.a){g.projs.destroyInRect(r)}
        if(p.a&&g.level.hitWall)g.level.hitWall(r,p.dmg)
      }
    }
  }
  destroyInRect(r){this.destroyIn(r)}
  draw(ctx){
    for(const p of this.l){if(!p.a)continue;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));const k=p.kind;
      if(k==='arrow'||k==='spear'){ctx.rotate(p.ang);ctx.fillStyle=k==='spear'?'#e8e0c8':'#a88a5a';ctx.fillRect(-8,-1,k==='spear'?18:14,2);ctx.fillStyle='#ddd';ctx.fillRect(k==='spear'?10:6,-2,3,4);ctx.fillStyle='#c33';ctx.fillRect(-9,-2,2,4)}
      else if(k==='holy'){ctx.globalCompositeOperation='lighter';const g2=ctx.createLinearGradient(-14*Math.sign(p.vx),0,10*Math.sign(p.vx),0);g2.addColorStop(0,'rgba(255,230,140,0)');g2.addColorStop(1,'rgba(255,250,210,.95)');ctx.fillStyle=g2;ctx.fillRect(-14,-p.h/2,28,p.h);ctx.fillStyle='#fff';ctx.fillRect(Math.sign(p.vx)*8-1,-p.h/2,2,p.h)}
      else if(k==='wave'){ctx.globalCompositeOperation='lighter';ctx.scale(Math.sign(p.vx)||1,1);const g2=ctx.createLinearGradient(-12,0,8,0);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(1,p.col);ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(-14,p.h/2);ctx.lineTo(8,p.h/2);ctx.quadraticCurveTo(10,0,4,-p.h/2);ctx.lineTo(-14,p.h/2);ctx.fill()}
      else if(k==='bomb'){const f=(p.t*14|0)%2;ctx.fillStyle=f?'#fff':'#e84a20';ctx.fillRect(-4,-4,8,8);ctx.fillStyle='#222';ctx.fillRect(-2,-2,1,1);ctx.fillRect(1,-2,1,1)}
      else{ctx.globalCompositeOperation='lighter';const r=p.w/2+2;const gr=ctx.createRadialGradient(0,0,0,0,0,r+3);gr.addColorStop(0,'#fff');gr.addColorStop(.4,p.col);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,r+3,0,6.283);ctx.fill();
        if(k==='frost'){ctx.rotate(p.t*5);ctx.fillStyle='#e8faff';ctx.fillRect(-3,-3,6,6)}}
      ctx.restore()}
  }
}

/* =====================================================================
   Sprites: procedural pixel-art knights (feet at origin, facing +x)
   ===================================================================== */
function drawKnight(ctx,o){
  const P=o.pal,C=k=>o.sil||P[k]||'#f0f',S=o.scale||1,id=o.id,t=o.t,st=o.st;
  const fr=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
  ctx.save();ctx.translate(Math.round(o.x),Math.round(o.y));ctx.scale(o.face*S,(o.flip?-1:1)*S);if(o.alpha!==undefined)ctx.globalAlpha=o.alpha;
  const wide=id==='gronn'?1.25:id==='seraphina'?.85:1;
  let by=0,lean=0,l1=0,l2=0,wang=50,ext=0,crouch=0;
  if(st==='idle'){by=Math.round(Math.sin(t*3)*.8);wang=55+Math.sin(t*3)*4}
  else if(st==='run'){const s=Math.sin(t*16);l1=s*4;l2=-s*4;by=-Math.abs(s)>.5?-1:0;lean=2;wang=35+s*10}
  else if(st==='jump'){l1=-3;l2=3;by=-1;wang=0}
  else if(st==='fall'){l1=3;l2=-2;wang=-30;lean=-1}
  else if(st==='dash'){lean=4;l1=-5;l2=5;wang=10}
  else if(st==='hurt'){lean=-4;wang=80;by=1}
  else if(st==='block'){crouch=2;by=1;wang=-70}
  else if(st==='special'){wang=-100;by=-1}
  else if(st==='attack'){const pr=U.ease(U.clamp(o.prog,0,1)),a0=o.a0,a1=o.a1;lean=3*pr;
    if(o.style==='thrust'||o.style==='stab'){wang=0;ext=pr<.35?-4*(pr/.35):-4+14*Math.min(1,(pr-.35)/.25)*(pr<.7?1:1-(pr-.7)/.3*.6);lean=2+pr*3;l1=-3;l2=3}
    else{wang=U.lerp(a0,a1,pr);l1=-2;l2=2}}
  const crch=crouch;
  if(st==='dead'){const k=U.clamp(t*2.5,0,1);ctx.translate(0,0);ctx.rotate(-k*Math.PI/2*.95);ctx.translate(0,-k*0)}
  if(st==='whirl'){ctx.translate(0,-14);ctx.rotate(t*26);ctx.translate(0,14)}
  /* cape / scarf behind body */
  if(id==='arthorius'||id==='seraphina'||id==='kael'){
    const L=id==='seraphina'?16:id==='kael'?10:12;
    for(let i=0;i<L;i+=2){const w=Math.sin(t*7-i*.5)*1.6+(o.vx?-o.vx*.01*i*.3:0);
      if(id==='kael'){fr(-5-i*.3+w*.3,-21+by+i*.9,10,3,C('cloth'))}
      else fr(-4-i+lean*-.3,-20+by+i*.35+w,3,id==='seraphina'?3:Math.max(3,8-i*.3),C('cloth'))}
    if(id==='kael'){for(let j=0;j<5;j++)fr(-5+j*2.2,-6+by+(j%2)*3,2,4+(j%2)*2,C('cloth'))}
  }
  /* legs */
  const lw=3*wide;
  fr(-4*wide+l1,-9+crch,lw,9-crch,C('dark'));fr(1*wide+l2,-9+crch,lw,9-crch,C('dark'));
  fr(-4*wide+l1,-2,lw+1,2,C('trim'));fr(1*wide+l2,-2,lw+1,2,C('trim'));
  /* torso */
  const tw=10*wide;
  fr(-tw/2+lean*.4,-21+by+crch,tw,12,C('armor'));fr(-tw/2+lean*.4,-21+by+crch,tw,2,C('trim'));fr(-tw/2+lean*.4,-11+by+crch,tw,2,C('dark'));
  if(id!=='kael')fr(-1+lean*.4,-19+by+crch,2,6,C('trim'));
  /* head */
  const hx=lean*.7,hy=by+crch;
  if(id==='arthorius'){fr(-4+hx,-29+hy,8,8,C('armor'));fr(-4+hx,-29+hy,8,1,C('trim'));fr(0+hx,-26+hy,4,1,o.sil||'#111');fr(-7+hx,-31+hy,5,3,C('cloth'));fr(-2+hx,-32+hy,2,3,C('cloth'))}
  else if(id==='seraphina'){fr(-3+hx,-28+hy,6,7,C('skin'));fr(-4+hx,-30+hy,7,3,C('hair'));fr(-4+hx,-28+hy,2,5,C('hair'));const sw=Math.sin(t*8)*2;fr(-8+hx+sw,-27+hy,5,2,C('hair'));fr(-10+hx+sw,-25+hy,3,2,C('hair'));fr(1+hx,-26+hy,2,1,C('eye'))}
  else if(id==='gronn'){fr(-5+hx,-31+hy,10,10,C('armor'));fr(-5+hx,-31+hy,10,2,C('trim'));fr(0+hx,-27+hy,5,2,o.sil||'#111');fr(-7+hx,-34+hy,2,5,C('trim'));fr(5+hx,-34+hy,2,5,C('trim'));fr(-7+hx,-36+hy,2,2,C('trim'));fr(5+hx,-36+hy,2,2,C('trim'))}
  else{fr(-4+hx,-30+hy,8,9,C('cloth'));fr(-2+hx,-33+hy,4,3,C('cloth'));fr(-6+hx,-28+hy,3,6,C('cloth'));fr(0+hx,-27+hy,4,4,o.sil||'#05030a');fr(1+hx,-26+hy,2,1,o.sil||C('eye'))}
  /* shield for Gronn */
  if(id==='gronn'){const bl=st==='block';ctx.save();if(bl){fr(5,-33,5,32,C('dark'));fr(6,-32,3,30,C('weapon'));fr(7,-26,1,16,C('trim'))}else{fr(-8,-27,4,20,C('dark'));fr(-7,-26,2,18,C('weapon'))}ctx.restore()}
  /* arm + weapon */
  ctx.save();ctx.translate(3*wide+lean*.4,-19+by+crch);
  const dag=id==='kael';
  const wp=(ang,off)=>{ctx.save();ctx.translate(off,0);ctx.rotate(ang*Math.PI/180);
    fr(0,-1,4,2,C('armor'));
    if(id==='arthorius'){fr(3,-1,3,2,C('weapon2'));fr(5,-3,2,6,C('weapon2'));fr(7,-1.5,18,3,C('weapon'));fr(25,-1,3,2,C('weapon'));fr(8,-.5,16,1,C('trim'))}
    else if(id==='seraphina'){fr(3,-1,2,2,C('weapon2'));fr(5,-3,2,6,C('weapon2'));fr(7,-.5,26,1.5,C('weapon'))}
    else if(id==='gronn'){fr(0,-1,24,2,C('weapon2'));fr(19,-7,11,14,C('weapon'));fr(19,-7,11,2,C('trim'));fr(28,-5,2,10,C('dark'))}
    else{fr(3,-1,12,2,C('weapon'));fr(13,-.5,3,1,C('weapon'))}
    ctx.restore()};
  wp(wang,ext);
  if(dag)wp(o.style==='stab'?-wang+(((o.ai|0)%2)?15:-15):wang*0.4-30,o.style==='stab'?-ext*.5:0);
  ctx.restore();
  if(id==='kael'&&!o.sil){ctx.globalCompositeOperation='lighter';ctx.fillStyle=o.shadow?'rgba(180,90,255,.7)':'rgba(180,90,255,.45)';ctx.fillRect(hx+0,-27+hy,5,3);ctx.globalCompositeOperation='source-over'}
  ctx.restore();
}

/* =====================================================================
   Player: knight controller (combo, dash, block/parry, special, potions)
   ===================================================================== */
class Player {
  constructor(g,id,variant){

/* =====================================================================

class Game {
  constructor(){
    this.cv=document.getElementById('cv');this.ctx=this.cv.getContext('2d');this.ctx.imageSmoothingEnabled=false;

    this.diff=CONFIG.difficulty[1];this.diffIdx=1;this.run=this.blankRun('arthorius',0,1);this.player=null;this.state='title';this.inRun=false;
    this.time=0;this.menuT=0;this.hitstopT=0;this.slowT=0;this.slowScale=1;this.timeScale=1;this.acc=0;this.last=performance.now();this.flashCol='#fff';this.flashA=0;this.bannerObj=null;this.boss=null;this.locked=false;
    this.combo=0;this.comboT=0;this.style=0;this.styleIdle=0;this.rank=0;this.tokensUsed=0;this.assist=1;this.deaths={};this.hpGhost=1;this.heartT=0;this.clearing=false;this.deathT=0;this.vacuum=false;this.bossPhase=0;this.stageKey=0;
    this.level.worldW=1e6;this.level.maxX=1e6;this.level.reg=CONFIG.regions[0];this.level.ri=0;this.level.type='waves';
    this.dark=document.createElement('canvas');this.dark.width=W;this.dark.height=H;this.dctx=this.dark.getContext('2d');
    this.vig=this.mkVig('0,0,0',.75);this.vigR=this.mkVig('200,0,0',.9);
    this.applySettings();this.resize();addEventListener('resize',()=>this.resize());
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.autoPause()});addEventListener('blur',()=>this.autoPause());
    this.frame=this.frame.bind(this);requestAnimationFrame(this.frame);
  }
  mkVig(c,a){const v=document.createElement('canvas');v.width=W;v.height=H;const x=v.getContext('2d'),g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba('+c+',0)');g.addColorStop(1,'rgba('+c+','+a+')');x.fillStyle=g;x.fillRect(0,0,W,H);return v}
  blankRun(kid,variant,diffIdx){return{kid,variant,diffIdx,ri:0,si:0,gold:0,score:0,kills:0,dmgTaken:0,parries:0,maxCombo:0,time:0,rerolls:0,continues:0,deaths:0,hitStage:false,hitBoss:false,elites:0,killer:null,bossesDown:0,bestRank:0,unlocked:[],stages:0}}
  applySettings(){const s=this.settings;audio.vol={master:s.master,music:s.music,sfx:s.sfx,mute:s.mute};audio.applyVol()}
  resize(){const k=Math.min(innerWidth/960,innerHeight/540);const r=document.getElementById('root');r.style.transform='translate('+(-480*k)+'px,'+(-270*k)+'px) scale('+k+')';document.getElementById('touch').classList.toggle('on',this.state==='playing')}
  autoPause(){if(this.state==='playing')this.pause()}
  /* ---------- run management ---------- */
  newRun(kid,diffIdx,variant,saved){
    this.diffIdx=diffIdx;this.diff=CONFIG.difficulty[diffIdx];this.player=new Player(this,kid,variant);this.run=this.blankRun(kid,variant,diffIdx);this.run.continues=this.diff.continues+this.player.m.continues;
    if(saved){Object.assign(this.player.m,saved.m);this.player.up=saved.up||{};this.player.recalc();this.player.hp=Math.min(saved.hp||this.player.maxHp,this.player.maxHp);this.player.potions=saved.potions;Object.assign(this.run,saved.run);this.run.ri=saved.ri;this.run.si=saved.si}
    else Save.data.stats.runs++;
    this.inRun=true;this.deaths={};this.combo=0;this.style=0;this.rank=0;this.director.reset();this.hpGhost=1;
    Save.data.last=kid;Save.data.lastDiff=diffIdx;Save.save();this.startStage(this.run.ri,this.run.si);
  }
  startStage(ri,si){
    this.state='playing';this.ui.hideAll();this.run.ri=ri;this.run.si=si;this.run.hitStage=false;this.run.hitBoss=false;this.clearing=false;this.deathT=0;this.vacuum=false;this.stageKey=ri*4+si;this.timeScale=1;this.slowT=0;

    Save.data.run={kid:r.kid,variant:r.variant,diffIdx:r.diffIdx,ri:r.ri,si:r.si,hp:p.hp,potions:p.potions,m:p.m,up:p.up,run:{gold:r.gold,score:r.score,kills:r.kills,dmgTaken:r.dmgTaken,parries:r.parries,maxCombo:r.maxCombo,time:r.time,rerolls:r.rerolls,continues:r.continues,elites:r.elites,bossesDown:r.bossesDown,bestRank:r.bestRank,stages:r.stages}};Save.save()}

    if(this.clearing)return;this.clearing=true;this.clearT=2.8;this.vacuum=true;this.locked=false;this.cam.focus=null;audio.sfx('bell');this.banner(boss?'REGION CONQUERED':'STAGE CLEAR','',2.4);
    if(!this.run.hitStage)this.unlock('flawless');if(boss){this.unlock(this.level.ri===0?'boss1':'__');if(!this.run.hitBoss)this.unlock('nohit')}

  }

    else{this.state='cards';document.getElementById('touch').classList.remove('on');this.ui.cards()}}

    this.assist=this.diff.assist?1-Math.min(.3,(this.deaths[this.stageKey]||0)*.08):1;const x=p.x;p.place(x);this.state='playing';this.ui.hideAll();this.clearing=false;this.vacuum=false;this.deathT=0;
    this.level.restart(this.level.checkpointWave,this.bossPhase);p.invuln=2;p.hp=Math.max(p.maxHp*.7,1);p.stam=p.maxStam;p.healPool=0;this.level.reg&&audio.setMusic(this.level.reg.music,this.level.boss);this.cam.snap(p.x);document.getElementById('touch').classList.add('on');this.director.reset();
  }
  victory(){const r=this.run,d=Save.data;d.beaten[r.kid]=true;d.stats.wins++;this.unlock('win');if(CONFIG.difficulty[r.diffIdx].id==='ashen')this.unlock('ashen');if(['arthorius','seraphina','gronn','kael'].every(k=>d.beaten[k]))this.unlock('winall');this.endRun(true)}
  endRun(win){
    const r=this.run,d=Save.data,df=this.diff,p=this.player;
    const shards=Math.max(1,Math.floor((r.score/600+(r.ri*4+r.si)*2.2+(win?45:0))*df.shards*p.m.shardMul));d.shards+=shards;this.lastShards=shards;
    const rec=d.records[r.kid]||(d.records[r.kid]={score:0,time:99999,rank:0});if(r.score>rec.score)rec.score=r.score;if(win&&r.time<rec.time)rec.time=r.time;if(r.bestRank>rec.rank)rec.rank=r.bestRank;
    d.run=null;Save.save();this.state='result';audio.stopMusic();document.getElementById('touch').classList.remove('on');this.ui.result(win,shards);
  }
  quitToMenu(){this.saveCheckpoint();this.inRun=false;this.state='title';this.player=null;this.enemies.length=0;for(const p of this.projs.l)p.a=false;this.cam.focus=null;this.cam.zoom=1;this.locked=false;audio.stopMusic();document.getElementById('touch').classList.remove('on');this.ui.title()}
  pause(){if(this.state!=='playing')return;this.state='paused';document.getElementById('touch').classList.remove('on');this.ui.pause()}

    const ub=s.querySelector('#ub');ub.appendChild(this.btn(free?'Reroll (free x'+g.run.rerolls+')':'Reroll ('+cost+'g)',()=>{if(free){g.run.rerolls--}else if(g.run.gold>=cost){g.run.gold-=cost}else{this.toast('Not enough gold','');return}this.rerollN++;this.cardList=this.roll();this.cards()}));
    ub.appendChild(this.btn('Skip (+40g)',()=>{g.run.gold+=40;this.cardList=[];g.nextStage()}));this.show('Cards');this.sel(1)}
  shop(){
    const g=this.g,p=g.player,r=g.run;this.shopBought=this.shopFresh===r.ri?this.shopBought:{};this.shopFresh=r.ri;
    const s=this.setup('Shop','<h2>THE BLACKSMITH</h2><div style="margin-bottom:8px;font-size:13px">Gold: <b style="color:#ffd040" id="gd">'+r.gold+'</b> &nbsp; Potions: '+p.potions+' &nbsp; HP '+Math.ceil(p.hp)+'/'+p.maxHp+'</div><div class="row" id="sg" style="width:800px;gap:8px"></div><div class="row" id="sb2" style="margin-top:10px"></div>');
    const sg=s.querySelector('#sg');
    CONFIG.shop.forEach(it=>{const price=Math.round(it.cost*(1+r.ri*.12)),bought=this.shopBought[it.id]||0,limit=it.id==='potion'?3:1,el=document.createElement('div');el.className='node nav';
      el.innerHTML='<b>'+it.name+'</b><br>'+it.desc+'<br><span style="color:#ffd040">'+(bought>=limit?'SOLD OUT':price+' gold')+'</span>';
      el.onclick=()=>{if(bought>=limit)return;if(r.gold<price){this.toast('Not enough gold','Need '+price);audio.sfx('hurt',.3);return}r.gold-=price;it.buy(g);this.shopBought[it.id]=bought+1;audio.sfx('pickup');this.shop()};sg.appendChild(el)});
    s.querySelector('#sb2').appendChild(this.btn('Leave for next region',()=>g.nextStage(),'big',{'data-first':1}));this.show('Shop');this.sel(CONFIG.shop.length)}
  /* ---------- per-frame UI ticks ---------- */
  tick(dt){
    if(this.active==='Title'){this.typeI+=dt*38;const el=document.getElementById('story');if(el)el.textContent=STORY.slice(0,Math.floor(this.typeI))+(Math.floor(this.typeI)<STORY.length&&(this.typeI*3|0)%2?'▌':'')}
    if(this.active==='Char'){const t=performance.now()/1000;for(const p of this.portraits){const k=CONFIG.knights[p.id],c=p.c,sel=p.card.classList.contains('sel')||p.card.classList.contains('chosen');c.clearRect(0,0,64,48);c.imageSmoothingEnabled=false;const pal={};for(const a in k.pal)pal[a]=U.recolor(k.pal[a],Save.data.selVar[p.id]||0);
      const cm=k.combo[0],prog=(t*1.4)%1,att=sel&&prog<.6;drawKnight(c,{id:p.id,pal,x:32,y:44,face:1,st:att?'attack':'idle',t,scale:k.scale*.95,prog:att?prog/.6:0,a0:cm.a0,a1:cm.a1,style:cm.style,ai:0})}}
  }
  drawLogo(ctx,t){
    const x=W/2,y=34,p=.6+.4*Math.sin(t*2);ctx.globalCompositeOperation='lighter';const gr=ctx.createRadialGradient(x,y,2,x,y,50);gr.addColorStop(0,'rgba(255,200,80,'+.7*p+')');gr.addColorStop(1,'rgba(255,100,0,0)');ctx.fillStyle=gr;ctx.fillRect(x-60,y-50,120,100);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#8a6a20';ctx.fillRect(x-17,y+2,34,7);ctx.fillStyle='#ffd040';ctx.fillRect(x-17,y+1,34,3);for(let i=0;i<5;i++){const px=x-16+i*8;ctx.fillStyle='#ffd040';ctx.beginPath();ctx.moveTo(px,y+3);ctx.lineTo(px+3,y-11-(i%2?0:4));ctx.lineTo(px+6,y+3);ctx.fill();ctx.fillStyle='#f44';ctx.fillRect(px+2,y-12-(i%2?0:4),2,2)}ctx.fillStyle='#3a2a2a';ctx.fillRect(x-15,y+4,30,2)}
  /* ---------- HUD ---------- */
  drawHUD(ctx){
    const g=this.g,p=g.player,r=g.run,lv=g.level;if(!p)return;
    ctx.save();ctx.textAlign='left';ctx.font='bold 7px "Courier New",monospace';
    const txt=(s,x,y,c='#fff',al='left')=>{ctx.textAlign=al;ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y)};
    /* portrait */
    ctx.fillStyle='#150f1b';ctx.fillRect(5,5,30,30);ctx.save();ctx.beginPath();ctx.rect(6,6,28,28);ctx.clip();drawKnight(ctx,{id:p.id,pal:p.pal,x:20,y:48,face:1,st:'idle',t:g.time,scale:p.k.scale*1.1,sil:p.flash>.3?'#fff':null});ctx.restore();ctx.strokeStyle=p.hp<p.maxHp*.3?'#f44':'#7a6030';ctx.lineWidth=1.5;ctx.strokeRect(5,5,30,30);
    /* bars */
    const hf=U.clamp(p.hp/p.maxHp,0,1);ctx.fillStyle='#000';ctx.fillRect(38,6,124,10);ctx.fillStyle='#200808';ctx.fillRect(39,7,122,8);ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillRect(39,7,122*U.clamp(g.hpGhost,0,1),8);
    const hg=ctx.createLinearGradient(0,7,0,15);hg.addColorStop(0,p.healPool>0?'#8f8':'#ff6060');hg.addColorStop(1,p.healPool>0?'#2a8a3a':'#a01818');ctx.fillStyle=hg;ctx.fillRect(39,7,122*hf,8);txt(Math.ceil(p.hp)+'/'+p.maxHp,100,14,'#fff','center');
    ctx.fillStyle='#000';ctx.fillRect(38,17,100,6);ctx.fillStyle='#0a2010';ctx.fillRect(39,18,98,4);ctx.fillStyle=p.stam<15?'#c84':'#40d078';ctx.fillRect(39,18,98*p.stam/p.maxStam,4);
    const sf=p.spMeter/100,full=sf>=1;ctx.fillStyle='#000';ctx.fillRect(38,24,84,7);ctx.fillStyle='#180a28';ctx.fillRect(39,25,82,5);ctx.fillStyle=full?(g.time*6%2<1?'#fff':'#e0a0ff'):'#a050e0';ctx.fillRect(39,25,82*Math.min(1,sf),5);
    if(full){txt('SPECIAL READY',126,31,'#e0a0ff')}
    if(p.k.charges>1){for(let i=0;i<p.k.charges;i++){ctx.fillStyle=i<p.charges?'#8cf':'#234';ctx.fillRect(140+i*7,18,5,5)}}
    for(let i=0;i<p.potions;i++){ctx.fillStyle='#183a24';ctx.fillRect(38+i*8,34,6,9);ctx.fillStyle='#4af080';ctx.fillRect(39+i*8,37,4,5);ctx.fillStyle='#ddd';ctx.fillRect(40+i*8,33,2,2)}
    if(p.healPool>0)txt('+',38+p.potions*8+2,42,'#6f8');
    let ix=38;for(const id in p.up){const u=CONFIG.upgrades.find(q=>q.id===id);if(!u)continue;if(ix>170)break;ctx.fillStyle='#120c18';ctx.fillRect(ix,46,10,10);ctx.strokeStyle=RARCOL[u.rar];ctx.lineWidth=1;ctx.strokeRect(ix+.5,46.5,9,9);ctx.fillStyle=RARCOL[u.rar];ctx.font='7px sans-serif';ctx.textAlign='center';ctx.fillText(u.ic,ix+5,54);if(p.up[id]>1){ctx.font='bold 5px monospace';ctx.fillStyle='#fff';ctx.fillText(p.up[id],ix+8,60)}ix+=12}
    ctx.font='bold 7px "Courier New",monospace';
    if(p.resolveT>0)txt('RESOLVE '+p.resolveT.toFixed(1),38,66,'#8cf');if(p.shadowT>0)txt('SHADOW '+p.shadowT.toFixed(1),38,66,'#c080ff');
    /* top right */
    ctx.fillStyle='#ffd040';ctx.fillRect(W-62,7,5,5);txt(String(r.gold),W-8,13,'#ffe080','right');txt('SCORE '+r.score,W-8,23,'#ddd','right');
    const rk=g.rank;if(g.style>0||g.combo>0){ctx.font='bold 22px "Courier New",monospace';txt(CONFIG.rankNames[rk],W-14,54,RANKCOL[rk],'right');ctx.font='bold 7px "Courier New",monospace';if(g.combo>1)txt(g.combo+' HITS',W-8,64,'#fff','right');
      const nx=CONFIG.rankStyle[rk+1]||CONFIG.rankStyle[rk]+30,pv=CONFIG.rankStyle[rk],fr=U.clamp((g.style-pv)/(nx-pv),0,1);ctx.fillStyle='#000';ctx.fillRect(W-62,67,54,4);ctx.fillStyle=RARCOL.Common;ctx.fillStyle=RANKCOL[rk];ctx.fillRect(W-61,68,52*fr,2)}
    /* stage info */
    txt(lv.reg.name.toUpperCase()+'  '+(lv.ri+1)+'-'+(lv.si+1),W/2,12,'#d8c8a0','center');if(lv.objective)txt(lv.objective,W/2,22,lv.type==='priest'&&!lv.priestDead?'#f8f':'#fff','center');
    if(lv.lantern&&lv.lantern.hp>0)txt('LANTERN '+Math.ceil(lv.lantern.hp),W/2,31,'#ffc040','center');
    if(lv.gustWarn>0)txt((lv.gustDir>0?'BLIZZARD GUST ►►►':'◄◄◄ BLIZZARD GUST'),W/2,42,'#8cf','center');else if(lv.gustT>0)txt((lv.gustDir>0?'►► WIND':'WIND ◄◄'),W/2,42,'#8cf','center');
    if(lv.type==='priest'&&!lv.priestDead){const pr=g.enemies.find(e=>e.type==='priest'&&!e.dead);if(pr){const sx=pr.x-g.cam.x;if(sx<4)txt('◄ ☠',10,130,'#f8f');else if(sx>W-4)txt('☠ ►',W-10,130,'#f8f','right')}}
    txt('CONT x'+r.continues,6,H-6,'#a89878');
    if(p.frozen>0)txt('FROZEN!',W/2,H/2-30,'#8ef','center');
    /* boss bar */
    const b=g.boss;if(b&&!b.gone&&b.state!=='intro'){const bw=300,bx=(W-bw)/2,by=H-22,f=U.clamp(b.hp/b.maxHp,0,1);txt(b.name,W/2,by-4,'#ffd8a0','center');ctx.fillStyle='#000';ctx.fillRect(bx-2,by-1,bw+4,12);ctx.fillStyle='#2a0808';ctx.fillRect(bx,by+1,bw,8);
      b.ghostHp=b.ghostHp===undefined?f:(f>b.ghostHp?f:U.lerp(b.ghostHp,f,.03));ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(bx,by+1,bw*b.ghostHp,8);const bg=ctx.createLinearGradient(0,by,0,by+10);bg.addColorStop(0,'#ff5a40');bg.addColorStop(1,'#a01010');ctx.fillStyle=bg;ctx.fillRect(bx,by+1,bw*f,8);
      ctx.fillStyle='#000';ctx.fillRect(bx+bw/3-1,by,2,10);ctx.fillRect(bx+bw*2/3-1,by,2,10);ctx.fillStyle='#ffd870';ctx.fillRect(bx+bw/3,by+1,1,8);ctx.fillRect(bx+bw*2/3,by+1,1,8);txt('PHASE '+(b.phase+1)+'/3',bx+bw,by-4,'#ccc','right')}
    /* banner */
    const bn=g.bannerObj;if(bn){const a=Math.min(1,bn.age/.25,(bn.dur-bn.age)/.45),sc=1+.2*Math.max(0,1-bn.age/.3);ctx.globalAlpha=Math.max(0,a);ctx.save();ctx.translate(W/2,96);ctx.scale(sc,sc);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(-W/2,-18,W,bn.s?36:28);ctx.font='bold 16px "Courier New",monospace';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(bn.t,0,-2);ctx.fillStyle='#ffd870';ctx.fillText(bn.t,0,-2);
      if(bn.s){ctx.font='bold 8px "Courier New",monospace';ctx.fillStyle='#e8dcc0';ctx.fillText(bn.s,0,12)}ctx.restore();ctx.globalAlpha=1}
    ctx.restore();
  }
